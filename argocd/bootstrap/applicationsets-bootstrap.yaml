apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationsets-bootstrap
  namespace: argocd

spec:
  project: default

  source:
    repoURL: "https://github.com/Gurinder12345/Network-Dashboard.git"
    targetRevision: HEAD
    path: argocd/applicationsets

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
