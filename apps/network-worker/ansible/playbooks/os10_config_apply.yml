---
# Dell OS10 approved configuration change (same model as os6_config_apply.yml).
#
# Generic ansible.netcommon.cli_command over network_cli; dellemc.os10 supplies only the
# connection plugins (OS10 prompt / error detection). Credentials come from environment
# variables set by ansible/run_os10.py and are never written here or printed.
# OS10 applies commands immediately (no commit step). Nothing is saved to startup.
- name: Dell OS10 approved configuration change
  hosts: all
  gather_facts: false

  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_REMOTE_USER') }}"
    ansible_password: "{{ lookup('env', 'ANSIBLE_PASSWORD') }}"

    effective_parents: "{{ config_parents | default([], true) }}"
    effective_lines: "{{ config_lines | default([], true) }}"

  tasks:
    - name: Validate approved configuration payload
      ansible.builtin.assert:
        that:
          - effective_parents is sequence
          - effective_parents is not string
          - effective_lines is sequence
          - effective_lines is not string
          - effective_lines | length > 0
        fail_msg: "Invalid approved configuration payload"

    - name: Enter configuration mode
      ansible.netcommon.cli_command:
        command: configure terminal

    - name: Enter configuration context
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ effective_parents }}"

    - name: Apply approved configuration commands
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ effective_lines }}"
      register: config_apply

    - name: Exit configuration mode
      ansible.netcommon.cli_command:
        command: end

    - name: Display apply result
      ansible.builtin.debug:
        var: config_apply
