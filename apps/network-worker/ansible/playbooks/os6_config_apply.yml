---
- name: Dell OS6 approved configuration change
  hosts: all
  gather_facts: false

  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_REMOTE_USER') }}"
    ansible_password: "{{ lookup('env', 'ANSIBLE_PASSWORD') }}"
    ansible_become_password: "{{ lookup('env', 'ANSIBLE_BECOME_PASSWORD') }}"

  tasks:
    - name: Debug approved configuration context
      ansible.builtin.debug:
        msg:
          - "config_parents={{ config_parents }}"
          - "config_lines={{ config_lines }}"

    - name: Enter configuration mode
      ansible.netcommon.cli_command:
        command: configure

    - name: Enter configuration parent
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ config_parents }}"

    - name: Apply approved configuration lines
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ config_lines }}"
      register: config_apply

    - name: Exit configuration mode
      ansible.netcommon.cli_command:
        command: end

    - name: Display apply result
      ansible.builtin.debug:
        var: config_apply
