apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-ui
  namespace: network-platform
  labels:
    app: network-ui

spec:
  replicas: 1

  selector:
    matchLabels:
      app: network-ui

  template:
    metadata:
      labels:
        app: network-ui

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      # Static file server; it never calls the Kubernetes API.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: network-ui
          image: ghcr.io/gurinder12345/network-ui:v0.1.16

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # nginx-unprivileged keeps its pid and temp files in /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
