# Only the lab/admin subnet may reach the dashboard (UI and /api) through Traefik.
# Requests from any other source get 403 Forbidden.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: network-dashboard-allowlist
  namespace: network-platform
  labels:
    app: network-ui

spec:
  ipAllowList:
    sourceRange:
      - 192.168.137.0/24
