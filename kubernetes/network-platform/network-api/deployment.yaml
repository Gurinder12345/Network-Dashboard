apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-api
  namespace: network-platform
  labels:
    app: network-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: network-api

  template:
    metadata:
      labels:
        app: network-api

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      # The API does not call the Kubernetes API.
      automountServiceAccountToken: false

      # Same UID/GID as network-worker so the API can read its 0600 backup files.
      # No fsGroup: the backups volume is read-only and must not be re-owned.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: network-api
          image: ghcr.io/gurinder12345/network-api:v0.1.2

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081

          env:
            - name: DB_HOST
              value: postgresql.network-platform.svc.cluster.local

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: networkdb

            - name: DB_USER
              value: networkapp

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: password

            - name: CELERY_BROKER_URL
              value: redis://redis-master.network-platform.svc.cluster.local:6379/0

            - name: BACKUP_ROOT
              value: /backups

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: backups
              mountPath: /backups
              readOnly: true

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: network-backups
            readOnly: true

        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
